<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2a221e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Đắc Mạnh ♥ Phương Anh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero" id="top">
    <div class="hero__media" aria-hidden="true">
      <img
        class="hero__img"
        src="web/thumb/TNA09524.jpg"
        srcset="web/thumb/TNA09524.jpg 720w, web/full/TNA09524.jpg 1600w"
        sizes="100vw"
        alt=""
        fetchpriority="high"
        decoding="async"
      />
    </div>
    <div class="hero__veil"></div>
    <div class="hero__content">
      <p class="hero__brand">Đắc Mạnh <span class="hero__heart" aria-label="trái tim">♥</span> Phương Anh</p>
      <h1 class="hero__title">Một ngày dịu dàng</h1>
      <p class="hero__sub">Gặp đúng người, đúng lúc, chúng mình mãi có nhau</p>
      <a class="hero__cta" href="#album">Xem album</a>
    </div>
    <div class="hero__scroll" aria-hidden="true">
      <span></span>
    </div>
  </header>

  <main id="album" class="album">
    <header class="album__intro reveal">
      <p class="album__eyebrow">Album</p>
      <h2 class="album__heading">Những khung hình đã chọn</h2>
    </header>

    <div class="gallery" id="gallery"></div>
  </main>

  <footer class="footer">
    <p>Với tất cả yêu thương</p>
    <a href="#top">Về đầu trang</a>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" type="button" aria-label="Đóng">×</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" aria-label="Ảnh trước">‹</button>
    <figure class="lightbox__figure">
      <img class="lightbox__img" alt="" draggable="false" />
    </figure>
    <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Ảnh sau">›</button>
    <p class="lightbox__count" aria-live="polite"></p>
    <p class="lightbox__hint">Vuốt để xem ảnh khác</p>
  </div>

  <audio id="bgMusic" src="music.mp3" loop preload="auto" playsinline></audio>

  <script src="script.js"></script>
</body>
</html>
